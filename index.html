<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garuda Security</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0f1c;
      color: #00ff99;
      text-align: center;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #ffffff;
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .card {
      background: #111a2e;
      padding: 20px;
      margin: 15px auto;
      max-width: 500px;
      border-radius: 12px;
      border: 1px solid #00ff99;
    }

    a {
      color: #00ff99;
      text-decoration: none;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      border: 1px solid #00ff99;
      border-radius: 8px;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛡️ Garuda Security</h1>
    <p class="tagline">
      Cybersecurity News • CVE Tracking • Threat Intelligence
    </p>

    <div class="card">
      <h3>📌 Latest Update</h3>
      <p>CVE reports & vulnerability tracking updates in real time.</p>
    </div>

    <div class="card">
      <h3>📡 Focus</h3>
      <p>Security awareness • Exploit research • Cyber defense education</p>
    </div>

    <div class="card">
      <h3>🔗 Connect</h3>
      <a class="btn" href="https://instagram.com/garuda.security.official" target="_blank">
        Instagram
      </a>
    </div>

    <footer>
      © 2026 Garuda Security | All rights reserved
    </footer>

  </div>

</body>
</html>
